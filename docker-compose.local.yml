# Local development stack.
#
# `docker-compose.yml` is the deployed topology: it pulls the published API
# image and attaches to an external reverse-proxy network that only exists on
# the server. Neither is true on a developer machine, so this file stands up
# the two backing services the API needs and nothing else — the API itself runs
# from source with `npm run start:dev`, which is what makes a debugger and a
# watch loop possible.
#
#   docker compose -f docker-compose.local.yml up -d postgres redis minio
#   docker compose -f docker-compose.local.yml --profile test up -d postgres_test
#
# The database name is `hms_v2_dev`, which is what `.env.local` must point at.
# It is deliberately NOT `hms_v2_prod`: a local database that shares a name with
# the production one is a database somebody eventually drops the wrong copy of.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hms_v2_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: hms_v2_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U db_user -d hms_v2_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hms_v2_redis_local
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage, so a developer testing an upload is not writing into the
  # shared bucket. `S3_ENDPOINT` in `.env.local` points here; without it the
  # code's own default is the deployed endpoint, and a logo uploaded from a
  # laptop lands on a URL the whole product serves.
  minio:
    image: minio/minio:latest
    container_name: hms_v2_minio_local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data_local:/data
    # The bucket, made by hand once. On a single drive MinIO reads a directory
    # under /data as a bucket, so this is all `mc mb` would have done — and it
    # means the first upload does not fail with `NoSuchBucket` from inside the
    # S3 client, which is nowhere a reader would look.
    #   docker exec hms_v2_minio_local mkdir -p /data/hmsbucket
    #
    # The bucket stays private, which is right: a URL this API hands back is
    # read by a signed-in client. If a local browser needs to fetch one
    # directly, set an anonymous download policy on it in the MinIO console at
    # http://localhost:9001 (minio_admin / minio_password).
    # `mc ready` would be the right check, but `minio/mc` is a separate image
    # and a local stack should not need a second pull to come up. MinIO answers
    # this endpoint as soon as it is serving.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # The media server the live voice conversation runs over.
  #
  # Self-hosted rather than LiveKit Cloud, and the reason is the handset. The
  # phone dials this URL *directly* — Nest mints a token and hands back the
  # address, it does not proxy the media — so the address has to be one the
  # phone can reach. On a developer's wifi that is the laptop's LAN address, and
  # a cloud project would put a third party between two devices that are a metre
  # apart. It also needs no account, which is what makes `npm run dev` enough.
  #
  # ── `--dev` and the credentials below
  #
  # `--dev` starts the server with the well-known development key/secret pair
  # `devkey` / `secret`, no TLS and no admission control. Those three facts are
  # the same fact: this is a development media server on a private network, and
  # the credentials are published in LiveKit's own documentation. **Anything
  # deployed must not use this file** — it is `docker-compose.local.yml`, it
  # binds the LAN, and a real deployment needs a real key, TLS and a turn server.
  #
  # ── Why the ports look like that
  #
  # 7880 is the signalling websocket, which is the only one the app names. The
  # other two carry the media, and they are the ones that decide whether a room
  # that connects can actually be heard: WebRTC publishes them as ICE candidates
  # and the audio goes over them directly, so a missing mapping is not a refused
  # connection — it is a room that joins, shows a live microphone, and passes no
  # sound in either direction.
  #
  # **7882/udp, not a range.** `--dev` puts the server in single-port UDP mode
  # and its own startup log says so: `rtc.portUDP {"Start":7882,"End":0}`. A
  # published 50000-50019 range was exactly wrong — twenty ports nothing listens
  # on, and the one port that matters unmapped.
  #
  # `network_mode: host` would avoid naming any of them, and is deliberately not
  # used: it would put the container on every interface of a machine that also
  # runs two other stacks.
  #
  # ── `--node-ip`, and why it cannot be left out
  #
  # The address the server advertises in its ICE candidates. Left alone it
  # advertises the container's own `172.x`, which is routable from this host and
  # from nowhere else — so the phone connects the websocket, joins the room, and
  # then waits for audio from an address on a docker bridge it has never heard
  # of. It has to be the LAN address, which is a DHCP lease, which is why it is
  # a variable and not a constant. `npm run dev` reads it from .env.local and
  # exports it; a bare `docker compose up livekit` without it falls back to
  # loopback and only works from this machine.
  livekit:
    image: livekit/livekit-server:latest
    container_name: hms_v2_livekit_local
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:7880/ >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  # The e2e database `.env.test` expects: port 5433, user hms_user, db
  # hms_v2_test. `tmpfs` rather than a volume because the suite truncates every
  # table on each run — there is nothing here worth keeping across a restart,
  # and a disposable data directory is one less way to lose the dev database by
  # pointing the wrong URL at it.
  postgres_test:
    image: postgres:16-alpine
    container_name: hms_v2_postgres_test
    profiles: ['test']
    environment:
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: hms_password
      POSTGRES_DB: hms_v2_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hms_user -d hms_v2_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_local:
  minio_data_local:
