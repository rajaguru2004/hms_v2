# Host-port remap for this machine ONLY. Generated during local setup.
#
# The canonical ports in docker-compose.local.yml (5432, 9000, 9001) were
# already bound on this machine by unrelated projects' containers:
#   `postgres`    -> 5432
#   `tnroa-minio` -> 9000-9001
# Those belong to other work and were deliberately NOT stopped, so this file
# moves hms_v2's bindings instead. Container-internal ports are unchanged.
#
# Usage (add this file AFTER the base file):
#   docker compose -f docker-compose.local.yml -f docker-compose.local.ports.yml up -d postgres redis minio
#
# `!override` replaces the base `ports` list instead of appending to it —
# without it Compose concatenates and re-binds the conflicting ports.
#
# If the conflicting containers are ever stopped, delete this file and the
# canonical ports work again (update .env.local to match).
services:
  postgres:
    ports: !override
      - '5442:5432'

  minio:
    ports: !override
      - '9010:9000'
      - '9011:9001'
