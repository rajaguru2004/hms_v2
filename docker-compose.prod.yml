version: '3.9'

services:
  # ── PostgreSQL (Production) ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hms_v2_postgres_prod
    restart: always
    environment:
      # These should match the credentials you will put in your .env DATABASE_URL
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: hms_v2_prod
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U db_user -d hms_v2_prod']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms_prod_network

volumes:
  postgres_data_prod:

networks:
  hms_prod_network:
    driver: bridge
